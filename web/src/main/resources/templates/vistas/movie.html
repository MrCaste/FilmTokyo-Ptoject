<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
      content="width=device-width, initial-scale=1">

    <title th:text="${movie.title}">Película</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS del header -->
    <link rel="stylesheet" th:href="@{/css/header.css}">

    <!-- CSS de la película -->
    <link rel="stylesheet" th:href="@{/css/movie.css}">

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="movie-page">

    <!-- HERO -->

    <section class="hero"
             th:style="'background-image:url(/uploads/' + ${movie.poster} + ')'">

        <div class="hero-overlay">

            <div class="hero-content">

                <img class="poster"
                     th:src="@{'/uploads/' + ${movie.poster}}"
                     alt="Poster">

                <div class="movie-info">

                    <h1 th:text="${movie.title}"></h1>

                    <div class="movie-meta">

                        <span class="badge"
                              th:text="${movie.releaseYear}">
                        </span>

                        <span class="badge">
                            🎬
                            <span th:text="${movie.director.name} + ' ' + ${movie.director.surname}"></span>
                        </span>

                    </div>

                    <div class="average-rating" th:if="${movie.reviewServiceAvailable}">

                        <span class="big-star">★</span>

                        <span class="score"
                            th:text="${movie.averageRating} ?: 'Sin valorar'">
                        </span>

                    </div>

                    <div class="average-rating" th:unless="${movie.reviewServiceAvailable}">
                        Servicio de valoraciones no disponible
                    </div>

                    <h3>Reparto</h3>

                    <div class="actors">

                        <span class="actor-chip"
                              th:each="actor : ${movie.actors}"
                              th:text="${actor.name} + ' ' + ${actor.surname}">
                        </span>

                    </div>

                    <a class="edit-btn"
                       th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                       th:href="@{/movies/edit/{id}(id=${movie.id})}">

                        ✏ Editar película

                    </a>

                </div>

            </div>

        </div>

    </section>



    <!-- REVIEW -->

    <section class="review-section"
             th:if="${#authorization.expression('isAuthenticated()') and reviewServiceAvailable}">

        <!-- Mensaje de éxito -->

        <div th:if="${success}" class="alert alert-success">

            <i class="bi bi-check-circle-fill"></i>

            <span th:text="${success}"></span>

        </div>

        <!-- Mensaje de error -->

        <div th:if="${errorMessage}" class="form-error">

            <i class="bi bi-exclamation-triangle-fill"></i>

            <span th:text="${errorMessage}"></span>

        </div>

        <h2>Tu valoración</h2>

        <form class="review-form"
              th:action="@{/movies/{id}/review(id=${movie.id})}"
              method="post">

            <input type="hidden"
                   name="id"
                   th:value="${movie.id}">

            <div class="rating">

                <input type="radio" id="star5" name="rating" value="5"
                       th:checked="${userReview != null && userReview.rating == 5}">
                <label for="star5">★</label>

                <input type="radio" id="star4" name="rating" value="4"
                       th:checked="${userReview != null && userReview.rating == 4}">
                <label for="star4">★</label>

                <input type="radio" id="star3" name="rating" value="3"
                       th:checked="${userReview != null && userReview.rating == 3}">
                <label for="star3">★</label>

                <input type="radio" id="star2" name="rating" value="2"
                       th:checked="${userReview != null && userReview.rating == 2}">
                <label for="star2">★</label>

                <input type="radio" id="star1" name="rating" value="1"
                       th:checked="${userReview != null && userReview.rating == 1}">
                <label for="star1">★</label>

            </div>

            <textarea
                    rows="8"
                    name="comment"
                    placeholder="¿Qué te ha parecido esta película?"
                    th:text="${userReview?.comment}">
            </textarea>

            <button type="submit">

                <span th:if="${userReview == null}">
                    Publicar crítica
                </span>

                <span th:if="${userReview != null}">
                    Actualizar crítica
                </span>

            </button>

        </form>

    </section>

    <section class="review-section"
             th:if="${#authorization.expression('isAuthenticated()') and !reviewServiceAvailable}">

        <div class="alert alert-warning">
            El servicio de valoraciones no está disponible en este momento.
        </div>

    </section>



    <!-- REVIEWS -->

    <section class="reviews"
             th:if="${reviewServiceAvailable}">

        <h2>

            Opiniones

            <span class="count"
                  th:text="${#lists.size(reviews)} + ' críticas'">
            </span>

        </h2>

        <div class="review-card"
             th:each="review : ${reviews}">

            <div class="review-header">

                <div>

                    <h3 th:text="${review.username}"></h3>

                    <small th:text="${#temporals.format(review.createdAt,'dd/MM/yyyy HH:mm')}">
                    </small>

                </div>

                <div class="review-stars">

                    <span th:each="i : ${#numbers.sequence(1,5)}">

                        <span th:if="${i <= review.rating}">
                            ★
                        </span>

                        <span th:if="${i > review.rating}"
                              class="empty-star">
                            ★
                        </span>

                    </span>

                </div>

            </div>

            <p class="comment"
               th:text="${review.comment}">
            </p>

        </div>

    </section>

    <section class="reviews"
             th:unless="${reviewServiceAvailable}">

        <h2>Opiniones</h2>

        <p>El servicio de valoraciones no está disponible.</p>

    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
