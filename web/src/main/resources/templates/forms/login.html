<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | FilmTokio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/login-signup.css}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="text-center mb-4">
            <i class="bi bi-film logo-icon"></i>
            <h1 class="title">FilmTokio</h1>
            <p class="subtitle">
                Inicia sesión para continuar
            </p>
        </div>

        <form th:action="@{/login}" method="post">

            <!-- Error -->
            <div th:if="${param.error}"
                class="form-error">

                <i class="bi bi-exclamation-triangle-fill"></i>
                Usuario o contraseña incorrectos.
            </div>

            <!-- Logout -->
            <div th:if="${param.logout}" class="alert alert-success">
                Has cerrado sesión correctamente.
            </div>

            <!-- Usuario -->
            <div class="mb-3">
                <label class="form-label">
                    Usuario o Email
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                    </span>

                    <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Introduce tu usuario o email">
                </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-4">

                <label class="form-label">
                    Contraseña
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                    <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Introduce tu contraseña">

                </div>

            </div>

            <button class="btn btn-login w-100" type="submit">
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar sesión
            </button>

        </form>

        <hr class="my-4">

        <div class="text-center">

            <a th:href="@{/home}" class="back-home">
                <i class="bi bi-arrow-left"></i>
                Volver al inicio
            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
