<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear artista | FilmTokio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/login-signup.css}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="text-center mb-4">

            <i class="bi bi-person-video3 logo-icon"></i>

            <h1 class="title">
                FilmTokio
            </h1>

            <p class="subtitle">
                Registrar nuevo artista
            </p>

        </div>

        <form th:action="@{/artists/new}" method="post">

            <!-- Éxito -->

            <div th:if="${success}" class="alert alert-success">

                <i class="bi bi-check-circle-fill me-2"></i>

                <span th:text="${success}"></span>

            </div>

            <!-- Errores -->

            <div th:if="${errorMessage}" class="form-error">

                <i class="bi bi-exclamation-triangle-fill"></i>

                <span th:text="${errorMessage}"></span>

            </div>

            <!-- Nombre -->

            <div class="mb-3">

                <label for="name" class="form-label">
                    Nombre *
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                    </span>

                    <input
                            id="name"
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Introduce el nombre">

                </div>

            </div>

            <!-- Apellido -->

            <div class="mb-3">

                <label for="surname" class="form-label">
                    Apellido
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person-badge-fill"></i>
                    </span>

                    <input
                            id="surname"
                            type="text"
                            name="surname"
                            class="form-control"
                            placeholder="Introduce el apellido (opcional)">

                </div>

            </div>

            <button class="btn btn-login w-100" type="submit">

                <i class="bi bi-person-plus-fill"></i>

                Crear artista

            </button>

        </form>

        <hr class="my-4">

        <div class="text-center">

            <a th:href="@{/}" class="back-home">

                <i class="bi bi-arrow-left"></i>

                Volver al inicio

            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
