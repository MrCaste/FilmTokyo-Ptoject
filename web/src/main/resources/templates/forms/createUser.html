<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear usuario | FilmTokio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/login-signup.css}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="text-center mb-4">

            <i class="bi bi-person-plus-fill logo-icon"></i>

            <h1 class="title">
                FilmTokio
            </h1>

            <p class="subtitle">
                Crear nuevo usuario
            </p>

        </div>

        <form th:action="@{/users/new}" method="post">

            <!-- Mensaje de éxito -->

            <div th:if="${success}" class="alert alert-success">

                <i class="bi bi-check-circle-fill"></i>

                <span th:text="${success}"></span>

            </div>

            <!-- Mensaje de error -->

            <div th:if="${errorMessage}" class="form-error">

                <i class="bi bi-exclamation-triangle-fill"></i>

                <span th:text="${errorMessage}"></span>

            </div>

            <!-- Usuario -->

            <div class="mb-3">

                <label class="form-label">
                    Usuario
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                    </span>

                    <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Introduce el nombre de usuario"
                            required>

                </div>

            </div>

            <!-- Email -->

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope-fill"></i>
                    </span>

                    <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Introduce el email"
                            required>

                </div>

            </div>

            <!-- Fecha de nacimiento -->

            <div class="mb-3">

                <label class="form-label">
                    Fecha de nacimiento
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-calendar-event-fill"></i>
                    </span>

                    <input
                            type="date"
                            name="birthDate"
                            class="form-control"
                            required>

                </div>

            </div>

            <!-- Contraseña -->

            <div class="mb-3">

                <label class="form-label">
                    Contraseña
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                    <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Introduce una contraseña"
                            required>

                </div>

            </div>

            <!-- Repetir contraseña -->

            <div class="mb-3">

                <label class="form-label">
                    Repetir contraseña
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-shield-lock-fill"></i>
                    </span>

                    <input
                            type="password"
                            name="repeatPassword"
                            class="form-control"
                            placeholder="Repite la contraseña"
                            required>

                </div>

            </div>

            <!-- Rol -->

            <div class="mb-4">

                <label class="form-label">
                    Rol
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person-gear"></i>
                    </span>

                    <select
                            name="role"
                            class="form-select"
                            required>

                        <option value="">
                            Selecciona un rol...
                        </option>

                        <option value="USER">
                            Usuario
                        </option>

                        <option value="ADMIN">
                            Administrador
                        </option>

                    </select>

                </div>

            </div>

            <button class="btn btn-login w-100" type="submit">

                <i class="bi bi-person-plus"></i>

                Crear usuario

            </button>

        </form>

        <hr class="my-4">

        <div class="text-center">

            <a th:href="@{/}" class="back-home">

                <i class="bi bi-arrow-left"></i>

                Volver al inicio

            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
