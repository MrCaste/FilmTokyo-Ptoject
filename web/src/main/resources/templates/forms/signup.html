<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | FilmTokio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/login-signup.css}">
</head>


<body>


<div class="signup-container login-container">


    <div class="login-card">


        <div class="text-center mb-4">

            <i class="bi bi-person-plus-fill logo-icon"></i>

            <h1 class="title">
                FilmTokio
            </h1>

            <p class="subtitle">
                Crea tu cuenta para empezar
            </p>

        </div>



        <form th:action="@{/signup}" method="post">



            <!-- Errores de validación -->

            <div th:if="${errorMessage}"
                class="form-error">

                <i class="bi bi-exclamation-triangle-fill"></i>

                <span th:text="${errorMessage}"></span>

            </div>



            <!-- Usuario -->

            <div class="mb-3">

                <label class="form-label">
                    Usuario
                </label>


                <div class="input-group">


                    <span class="input-group-text">

                        <i class="bi bi-person-fill"></i>

                    </span>


                    <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Introduce tu usuario">

                </div>


            </div>




            <!-- Email -->

            <div class="mb-3">


                <label class="form-label">
                    Email
                </label>


                <div class="input-group">


                    <span class="input-group-text">

                        <i class="bi bi-envelope-fill"></i>

                    </span>


                    <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Introduce tu email">


                </div>


            </div>

            <!-- Fecha de nacimiento -->

            <div class="mb-3">

                <label for="birthDate" class="form-label">
                    Fecha de nacimiento
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-calendar-date"></i>
                    </span>

                    <input
                            id="birthDate"
                            type="date"
                            name="birthDate"
                            class="form-control">

                </div>

            </div>

            <!-- Contraseña -->


            <div class="mb-3">


                <label class="form-label">
                    Contraseña
                </label>


                <div class="input-group">


                    <span class="input-group-text">

                        <i class="bi bi-lock-fill"></i>

                    </span>


                    <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Crea una contraseña">


                </div>


            </div>





            <!-- Confirmar contraseña -->


            <div class="mb-4">


                <label class="form-label">
                    Repetir contraseña
                </label>


                <div class="input-group">


                    <span class="input-group-text">

                        <i class="bi bi-shield-lock-fill"></i>

                    </span>


                    <input
                            type="password"
                            name="repeatPassword"
                            class="form-control"
                            placeholder="Repite la contraseña">


                </div>


            </div>





            <button class="btn btn-login w-100" type="submit">


                <i class="bi bi-person-plus"></i>


                Crear cuenta


            </button>



        </form>




        <hr class="my-4">




        <div class="text-center">


            <p class="subtitle mb-2">
                ¿Ya tienes una cuenta?
            </p>


            <a th:href="@{/login}" class="back-home">


                <i class="bi bi-box-arrow-in-right"></i>


                Iniciar sesión


            </a>



        </div>



    </div>


</div>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>


</html>
